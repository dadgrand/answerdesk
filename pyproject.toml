[project]
name = "answerdesk"
version = "0.1.0"
description = "Local-first, multilingual customer-support RAG+LLM reference stack: hybrid retrieval, grounded citations, calibrated escalation, semantic cache and reproducible evals."
authors = [{ name = "answerdesk contributors" }]
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
keywords = ["rag", "retrieval", "customer-support", "multilingual", "llm", "conformal-prediction"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "typer>=0.12.3,<1",
  "pyyaml>=6.0.1,<7",
  "numpy>=1.26,<3",
  "httpx>=0.27,<1",
  # --- ingestion parsers (t4, FR-ING-01) ---------------------------------------
  # Light, pure-Python (python-docx pulls lxml, which ships manylinux/win wheels).
  # Every import is lazy inside answerdesk.ingest.loaders, so importing the package
  # or the CLI without these installed still works (NFR-PORT-03).
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "beautifulsoup4>=4.12,<5",
  # --- sparse retrieval (t5, FR-RET-01) ----------------------------------------
  "bm25s>=0.2,<1",
  # --- report plots (t7, §10.8) ------------------------------------------------
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
# Test/lint/type tooling. CI installs only this extra: no torch, no network.
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
  "types-PyYAML>=6.0.12",
]
# Real local embedding + cross-encoder reranking. Heavy: torch, no CUDA required.
# Windows CUDA wheels: see docs/architecture.md "Local model setup".
local = [
  "torch>=2.3,<3",
  "sentence-transformers>=3.0,<6",
]
# Optional vector store adapter (the default dense index is exact numpy search).
qdrant = [
  "qdrant-client>=1.9,<2",
]
# HTTP service surface. Base install stays CLI/library only.
api = [
  "fastapi>=0.111,<1",
  "uvicorn>=0.30,<1",
  "sse-starlette>=2.1,<4",
]

[project.scripts]
answerdesk = "answerdesk.cli:main"

[project.urls]
Documentation = "https://github.com/answerdesk/answerdesk#readme"
Source = "https://github.com/answerdesk/answerdesk"
Issues = "https://github.com/answerdesk/answerdesk/issues"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/answerdesk"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "configs", "docs", "scripts", ".env.example", "LICENSE"]

[tool.uv]
# Editable install of this project for `uv run`, plus a compiled bytecode cache
# is intentionally not configured: determinism over speed in CI.
default-groups = []

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error::DeprecationWarning:answerdesk.*"]
markers = [
  "smoke: fast structural checks that must never need network or model weights",
  "integration: offline integration tests with deterministic doubles",
]

[tool.coverage.run]
source = ["src/answerdesk"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@abstractmethod",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
force-exclude = true
exclude = [".venv", "build", "dist", "reports"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # bugbear
  "SIM",  # simplify
  "RUF",  # ruff-specific
  "PTH",  # pathlib
  "TID",  # tidy imports
]
ignore = [
  "RUF001", # ambiguous unicode in strings: the corpus and prompts are multilingual
  "RUF002", # ambiguous unicode in docstrings
  "RUF003", # ambiguous unicode in comments
  "RUF012", # mutable class attribute annotations are not worth the noise in pydantic models
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]  # `assert False` is allowed in "must fail" tests
"src/answerdesk/testing/**" = ["B008"]  # defaults in test doubles are fine
"src/answerdesk/cli.py" = ["B008"]  # typer.Option(...) in defaults is the typer idiom

[tool.ruff.lint.isort]
known-first-party = ["answerdesk"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
# Target 3.12 for analysis: numpy 2.x stubs use PEP 695 `type` statements that
# mypy refuses to parse under a 3.11 target. Runtime support stays 3.11+ (ruff
# target-version=py311 guards against 3.12-only syntax).
python_version = "3.12"
files = ["src/answerdesk"]
strict = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
ignore_missing_imports = true

