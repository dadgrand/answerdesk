# Profile: local — generation and retrieval on a local OpenAI-compatible server.
#
#   ollama serve && ollama pull qwen3:8b
#   uv sync --extra local
#   uv run answerdesk --profile local config check
#
# The local profile is the "no data leaves the machine" path (NFR-PORT-01). The preset can
# be vllm or llama_cpp instead of ollama; only base_url/model differ (ADR-003).
# torch is required for the local embedder/reranker: see docs/architecture.md
# §"Local model setup" for the Windows CUDA wheel instructions.

profile: local

llm:
  preset: ollama
  base_url: http://127.0.0.1:11434/v1
  model: qwen3:8b
  temperature: 0.0
  max_tokens: 1024
  timeout_s: 120.0
  max_retries: 2
  json_mode: true

embedding:
  backend: bge_m3
  model: BAAI/bge-m3
  batch_size: 16
  device: auto

retrieval:
  rerank:
    enabled: true
    model: BAAI/bge-reranker-v2-m3
    top_in: 50
    top_out: 12
